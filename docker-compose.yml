

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: multienv_mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-multienv}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - multienv-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Development Service
  backend-dev:
    build:
      context: ./backend/dev
      dockerfile: Dockerfile
    container_name: multienv_backend_dev
    ports:
      - "${BACKEND_DEV_PORT:-5000}:5000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB_NAME:-multienv}?authSource=admin
      FLASK_APP: app.py
    volumes:
      - ./backend/dev:/app
      - /app/__pycache__
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - multienv-network
    profiles:
      - dev
    command: flask run --host=0.0.0.0

  # Backend Production Service
  backend-prod:
    build:
      context: ./backend/prod
      dockerfile: Dockerfile
    container_name: multienv_backend_prod
    ports:
      - "${BACKEND_PROD_PORT:-5001}:5000"
    environment:
      FLASK_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB_NAME:-multienv}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - multienv-network
    profiles:
      - prod
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multienv_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - multienv-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  multienv-network:
    driver: bridge
